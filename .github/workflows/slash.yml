name: Sync SkyPanel to My Project (Panel branch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo (Panel branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: Panel

      - name: Clone source repo
        run: |
          set -e
          SRC_DIR="/tmp/skypanel-src"
          rm -rf "$SRC_DIR"
          git clone --depth 1 https://github.com/parsayebanafshi12/SkyPanel.git "$SRC_DIR"

      - name: Copy files (excluding .git, .github, .md)
        run: |
          set -e

          # حذف .git مخزن مبدأ (حیاتی برای push)
          rm -rf /tmp/skypanel-src/.git

          # حذف .github مخزن مبدأ تا با ورک‌فلوی خودت تداخل نکند
          rm -rf /tmp/skypanel-src/.github

          # حذف همه‌ی فایل‌های .md در هر مسیری
          find /tmp/skypanel-src -type f -name '*.md' -delete

          # پاک‌سازی محتوای پروژه به جز .git و .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # کپی همه‌ی محتوا (شامل فایل‌های مخفی)
          cp -r /tmp/skypanel-src/. .

          # نمایش برنچ فعلی و وضعیت
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          git status --short | head -30

      - name: Configure git
        run: |
          git config user.name  "SKY PANEL"
          git config user.email "skypanel2[bot]@users.noreply.github.com"

      - name: Commit & Push to Panel branch
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "Railway Deploy"
            git push origin HEAD:Panel
          fi
